<!DOCTYPE html>
<html lang="en">
<head>

<title>New tab</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; color: #eee; font: 16px system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  form { width: min(560px, 80vw); }
  input { width: 100%; box-sizing: border-box; padding: 14px 20px; background: #000; color: #fff;

</style>
</head>
<body>
  <form id="f"><input id="q" type="text" placeholder="Search the web" autofocus autocomplete="off"></form>
  <script src="newtab.js"></script>
</body>
</html>
