<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OLED True Black</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="app">
    <nav class="side">
      <div class="brand">OLED True Black <small id="ver"></small></div>
      <div id="tabs"></div>
    </nav>
    <main id="main"></main>
    <aside class="preview">
      <h2 data-i18n="pvTitle"></h2>
      <div class="cap" data-i18n="pvBefore"></div>
      <div class="mock" id="mockBefore"></div>
      <div class="cap" data-i18n="pvAfter"></div>
      <div class="mock" id="mockAfter"></div>
      <div class="pix" id="pixels"></div>
      <div class="hint" data-i18n="pvNote"></div>
    </aside>
  </div>
  <script src="core.js"></script>
  <script src="sitefixes.js"></script>
  <script src="i18n.js"></script>
  <script src="controls.js"></script>
  <script src="preview.js"></script>
  <script src="options.js"></script>
</body>
</html>
