<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <a id="update" href="#" hidden></a>
  <header>
    <h1>OLED True Black <small id="ver"></small></h1>
    <label class="sw" id="masterSw" data-i18n-title="tipMaster"><input type="checkbox" id="enabled"><i></i></label>
  </header>

  <div class="card">
    <div class="siteline"><b id="host"></b><span class="dim" id="modeDesc"></span></div>
    <div id="modeSeg"></div>
  </div>
  <div class="card scopeline">
    <span data-i18n="editFor"></span>
    <div id="scopeSeg"></div>
  </div>
  <div class="hint" id="scopeHint"></div>

  <div id="sections"></div>

  <div class="hint" id="stats"></div>
  <div class="foot">
    <a href="#" id="more" data-i18n="moreSettings"></a>
    <button id="report" data-i18n="reportSite" data-i18n-title="reportTip"></button>
  </div>
  <script src="core.js"></script>
  <script src="sitefixes.js"></script>
  <script src="i18n.js"></script>
  <script src="controls.js"></script>
  <script src="popup.js"></script>
</body>
</html>
